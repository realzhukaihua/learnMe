[project]
name = "learnme"
version = "0.1.0"
description = "A web console that dispatches coding-agent tasks across projects, supervises them, and learns how you judge"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.168",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
slack = [
    "aiohttp>=3.9",
    "slack-bolt>=1.30.0",
    "slack-sdk>=3.45.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
